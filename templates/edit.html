{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">

        <div class="card shadow-sm">
            <div class="card-body">

                <h2 class="card-title mb-3">名前を編集する</h2>

                <form 
                    action="{{ url_for('members.update', member_id=member['id']) }}" 
                    method="post">

                    <input
                        type="hidden"
                        name="csrf_token"
                        value="{{ csrf_token() }}">

                    <div class="mb-3">
                        <label class="form-label">名前</label>
                        <input 
                            type="text" 
                            class="form-control" 
                            name="name" 
                            value="{{ member['name'] }}" 
                            required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">読み仮名</label>
                        <input 
                            type="text" 
                            class="form-control"
                            name="yomi" 
                            value="{{ member['yomi'] }}" 
                            required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">電話番号</label>
                        <input
                            type="tel"
                            class="form-control"
                            name="phone"
                            value="{{ member['phone'] }}"
                            placeholder="09012345678"
                            autocomplete="tel">
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">メールアドレス</label>
                        <input
                            type="email"
                            class="form-control"
                            name="email"
                            value="{{ member['email'] }}"
                            placeholder="sample@example.com"
                            autocomplete="email">
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-check-circle"></i> 更新
                        </button>
                    </div>
                    
                </form>

                <div class="mt-3">
                    <a class="btn btn-outline-secondary"
                        href="{{ url_for('members.list_members') }}">
                        <i class="bi bi-arrow-left"></i> 戻る
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
